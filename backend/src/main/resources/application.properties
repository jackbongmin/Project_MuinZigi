spring.application.name=mujinjigi

# 저장소 루트의 .env를 설정값으로 읽음 (backend/ 폴더에서 실행하는 기준). 파일이 없어도 오류 없이 넘어감
spring.config.import=optional:file:../.env[.properties]

# DB 접속 정보는 .env에서 가져옴
# ${이름:기본값}: .env에 값이 없으면 기본값을 씀
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 개발 단계에서는 엔티티에 맞춰 테이블을 자동으로 고침. 배포 전에 마이그레이션 도구로 바꿀 예정임
spring.jpa.hibernate.ddl-auto=update
# 요청이 끝나면 DB 연결을 바로 닫음 (화면 렌더링 중 지연 조회 방지)
spring.jpa.open-in-view=false

# 영상 업로드. 기본 제한(1MB)으로는 영상을 받을 수 없어서 늘림
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=500MB
# 업로드한 영상을 저장할 폴더 (backend/ 기준, 저장소 루트의 uploads/는 커밋되지 않음). 배포 때 S3로 바꿀 예정
app.storage.video-dir=../uploads/videos
# 영상에서 뽑은 프레임을 저장할 폴더. 영상마다 하위 폴더(영상 id)를 만듦
app.storage.frame-dir=../uploads/frames

# 프레임 추출 (FFmpeg). PATH에 ffmpeg가 있으면 이름만 써도 됨
app.ffmpeg.path=ffmpeg
# 장면 변화 점수가 이 값보다 크면 "움직임 있음"으로 봄. 빈 매장 점수가 0.005 이하였음 (결정 003)
app.frame.scene-threshold=0.005
# 움직임이 있는 프레임의 앞뒤 몇 초까지 남길지. 제자리에서 손만 움직이는 동작을 놓치지 않으려고 넓게 잡음
app.frame.window-seconds=2

# Jev (TypeSafe). 별칭(jev-latest)은 새 버전이 나오면 바뀌므로 버전을 고정함
jev.base-url=https://api.typesafe.ai
jev.model=jev-1.14.0
jev.api-key=${JEV_API_KEY:}
# 연결·응답 시간 제한(밀리초). 넘으면 끊고 재시도함. 평소 응답은 프레임 1장에 0.3초 정도임
jev.connect-timeout-ms=5000
jev.read-timeout-ms=30000
# 실패 시 재시도 횟수와 첫 대기 시간. 대기 시간은 두 배씩 늘어남 (0.5초 → 1초). Jev 공식 SDK 기본값과 같음
jev.retry.max-retries=2
jev.retry.base-delay-ms=500
