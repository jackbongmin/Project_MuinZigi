spring.application.name=mujinjigi

# 저장소 루트의 .env를 설정값으로 읽음 (backend/ 폴더에서 실행하는 기준). 파일이 없어도 오류 없이 넘어감
spring.config.import=optional:file:../.env[.properties]

# DB 접속 정보는 .env에서 가져옴
# ${이름:기본값}: .env에 값이 없으면 기본값을 씀
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 개발 단계에서는 엔티티에 맞춰 테이블을 자동으로 고침. 배포 전에 마이그레이션 도구로 바꿀 예정임
spring.jpa.hibernate.ddl-auto=update
# 요청이 끝나면 DB 연결을 바로 닫음 (화면 렌더링 중 지연 조회 방지)
spring.jpa.open-in-view=false

# Jev (TypeSafe). 별칭(jev-latest)은 새 버전이 나오면 바뀌므로 버전을 고정함
jev.base-url=https://api.typesafe.ai
jev.model=jev-1.14.0
jev.api-key=${JEV_API_KEY:}
